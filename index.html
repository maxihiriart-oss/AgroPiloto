width:100%;padding:12px;border:1px solid #ccd4ce;border-radius:11px;background:white;font-size:15px;margin:5px 0 12px}textarea{min-height:90px}label{font-size:13px;font-weight:700}.chips{display:flex;gap:7px;overflow:auto;margin:12px 0}.chip{background:var(--soft);color:var(--green);white-space:nowrap;padding:8px 11px}.chip.active{background:var(--green);color:white}.back{background:transparent;color:var(--green);padding:6px 0;margin-bottom:8px}.status{margin-top:14px;background:var(--soft);padding:12px;border-radius:12px}.status b,.status span{display:block}.status p{font-size:13px;margin-bottom:0}.tag,.saved{display:inline-block;background:var(--soft);color:var(--green);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:750}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav button{background:white;color:#65716b;border-radius:0;padding:11px 4px 14px;font-size:11px}.nav button.active{color:var(--green);font-weight:850}.nav b{display:block;font-size:18px;margin-bottom:2px}@media(max-width:430px){.grid3{gap:6px}.metric b{font-size:22px}.card{border-radius:15px}}</style></head><body><header><b>AGRO COPILOTO</b><small>Santa María de Bequelo · Invierno 2026/27</small></header><main><section id="home" class="view active"></section><section id="lots" class="view"></section><section id="pending" class="view"></section><section id="new" class="view"></section></main><nav class="nav"><button class="active" data-view="home"><b>⌂</b>Inicio</button><button data-view="lots"><b>▦</b>Lotes</button><button data-view="pending"><b>!</b>Pendientes</button><button data-view="new"><b>＋</b>Nueva labor</button></nav><script src="app-simple.js?v=9"></script></body></html>
